aid: infinigods
name: InfiniGods
description: 'InfiniGods is a gaming studio building fun, free-to-play, Web3-powered
  mobile games centered around ancient mythologies. Its titles — Immortal Siege, King
  of Destiny, and InfiniMerge — share interoperable gaming assets, items, power-ups,
  and currencies that span the InfiniGods Universe (IGU). Players collect blockchain
  assets such as the Elder Gods (a 4,488-piece Gen 0 NFT collection that unlocks abilities
  and boosts scoring across all titles) and the InfiniPass VIP membership (early access,
  bonus play, exclusive NFT drops, and in-game boosts). The company is backed by Pantera
  Capital. InfiniGods is a consumer game studio with no public developer/API program;
  this profile captures its public web, legal, community, and code-org surface.'
